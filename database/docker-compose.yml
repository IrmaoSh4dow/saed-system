services:
  postgres:
    image: postgres:16-alpine
    container_name: saed-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: saed
      POSTGRES_PASSWORD: saed
      POSTGRES_DB: saed
    volumes:
      - saed_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saed -d saed"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saed_postgres_data:
