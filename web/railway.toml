# Railway service config (Root Directory = web/)
# Node version comes from package.json engines + .nvmrc (Nixpacks Node provider).

[build]
builder = "NIXPACKS"

[deploy]
startCommand = "npm run start:railway"
healthcheckPath = "/"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
