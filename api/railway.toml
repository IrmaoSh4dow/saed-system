# Railway API service — Root Directory MUST be `api`

[build]
builder = "NIXPACKS"
# Install includes build tooling; Nest CLI lives in dependencies for production images.
buildCommand = "npm run build"

[deploy]
# server.cjs binds PORT first, then migrate + Nest. Catalog seed is opt-in via RUN_PRISMA_SEED.
startCommand = "node server.cjs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
