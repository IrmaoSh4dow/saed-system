# Railway API service — Root Directory MUST be `api`

[build]
builder = "NIXPACKS"
# Install includes build tooling; Nest CLI lives in dependencies for production images.
buildCommand = "npm run build"

[deploy]
# Migrate + seed against DATABASE_URL, then bind PORT (see server.cjs).
# Seed upserts catalogs/@sh4dow; operational prune only if PRUNE_OPERATIONAL_DATA=true.
startCommand = "npx prisma migrate deploy && npm run prisma:seed && node server.cjs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
