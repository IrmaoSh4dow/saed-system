# Railway API service — Root Directory MUST be `api`

[build]
builder = "NIXPACKS"
buildCommand = "npm run build"

[deploy]
# Migrate + seed against DATABASE_URL, then bind PORT (see server.cjs).
# Seed keeps @sh4dow and base catalogs; prunes operational data when enabled.
startCommand = "npx prisma migrate deploy && npm run prisma:seed && node server.cjs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
