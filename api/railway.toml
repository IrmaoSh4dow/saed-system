# Railway API service — Root Directory MUST be `api`

[build]
builder = "NIXPACKS"
# Install includes build tooling; Nest CLI lives in dependencies for production images.
buildCommand = "npm run build"

[deploy]
# server.cjs binds PORT first, then runs migrate + seed + Nest boot itself.
# Chaining migrate/seed ahead of the listener made any of their failures show up
# as an unreachable service instead of a diagnosable /health response.
# Seed upserts catalogs/@sh4dow; operational prune only if PRUNE_OPERATIONAL_DATA=true.
startCommand = "node server.cjs"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
